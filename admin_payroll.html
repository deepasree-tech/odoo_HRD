<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dayflow - Admin Payroll</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">Dayflow</div>

    <a href="admin.html">
        Dashboard
    </a>

</header>


<main class="admin-payroll-page">

    <h1>Payroll Management</h1>


    <section class="payroll-table">

        <table>

            <thead>

                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Job</th>
                    <th>Current Salary</th>
                    <th>Update Salary</th>
                    <th>Action</th>
                </tr>

            </thead>


            <tbody>

                <tr>

                    <td>EMP001</td>
                    <td>Employee One</td>
                    <td>Developer</td>
                    <td>₹45,000</td>

                    <td>
                        <input
                            type="number"
                            value="45000"
                        >
                    </td>

                    <td>
                        <button class="updateSalary">
                            Update
                        </button>
                    </td>

                </tr>


                <tr>

                    <td>EMP002</td>
                    <td>Employee Two</td>
                    <td>Designer</td>
                    <td>₹40,000</td>

                    <td>
                        <input
                            type="number"
                            value="40000"
                        >
                    </td>

                    <td>
                        <button class="updateSalary">
                            Update
                        </button>
                    </td>

                </tr>


                <tr>

                    <td>EMP003</td>
                    <td>Employee Three</td>
                    <td>Tester</td>
                    <td>₹38,000</td>

                    <td>
                        <input
                            type="number"
                            value="38000"
                        >
                    </td>

                    <td>
                        <button class="updateSalary">
                            Update
                        </button>
                    </td>

                </tr>

            </tbody>

        </table>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
