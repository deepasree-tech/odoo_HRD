<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dayflow - Reports</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="logo">Dayflow</div>

    <a href="admin.html">
        Dashboard
    </a>

</header>


<main class="reports-page">

    <h1>Analytics & Reports</h1>


    <section class="report-summary">

        <div class="report-card">

            <h3>Total Employees</h3>

            <p>50</p>

        </div>


        <div class="report-card">

            <h3>Present Today</h3>

            <p>42</p>

        </div>


        <div class="report-card">

            <h3>Leave Requests</h3>

            <p>8</p>

        </div>


        <div class="report-card">

            <h3>Payroll Records</h3>

            <p>50</p>

        </div>

    </section>


    <section class="attendance-report">

        <h2>Attendance Report</h2>

        <table>

            <thead>

                <tr>
                    <th>Status</th>
                    <th>Employees</th>
                    <th>Percentage</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <td>Present</td>
                    <td>42</td>
                    <td>84%</td>
                </tr>

                <tr>
                    <td>Absent</td>
                    <td>3</td>
                    <td>6%</td>
                </tr>

                <tr>
                    <td>Half-day</td>
                    <td>2</td>
                    <td>4%</td>
                </tr>

                <tr>
                    <td>Leave</td>
                    <td>3</td>
                    <td>6%</td>
                </tr>

            </tbody>

        </table>

    </section>


    <section class="report-actions">

        <button id="printReport">
            Print Report
        </button>

        <button id="salaryReport">
            Salary Report
        </button>

        <button id="attendanceReport">
            Attendance Report
        </button>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
