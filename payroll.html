<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dayflow - Payroll</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">Dayflow</div>

    <a href="emp.dashboard.html">
        Dashboard
    </a>

</header>


<main class="payroll-page">

    <h1>Payroll</h1>

    <p>
        Your payroll information is read-only.
    </p>


    <section class="salary-card">

        <h2>Salary Details</h2>


        <div class="salary-row">
            <span>Employee ID</span>
            <strong>EMP001</strong>
        </div>


        <div class="salary-row">
            <span>Employee Name</span>
            <strong>Employee One</strong>
        </div>


        <div class="salary-row">
            <span>Job Position</span>
            <strong>Software Developer</strong>
        </div>


        <div class="salary-row">
            <span>Basic Salary</span>
            <strong>₹35,000</strong>
        </div>


        <div class="salary-row">
            <span>Allowances</span>
            <strong>₹10,000</strong>
        </div>


        <div class="salary-row total">
            <span>Monthly Salary</span>
            <strong>₹45,000</strong>
        </div>


        <button id="printSalary">
            Print Salary Slip
        </button>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
